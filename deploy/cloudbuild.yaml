# Cloud Build pipeline: build -> push -> migrate -> deploy.
#
# Submit with:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=REGION,_INSTANCE_CONNECTION_NAME=PROJECT:REGION:INSTANCE,_SERVICE=pca-app
#
# Image path: REGION-docker.pkg.dev/$PROJECT_ID/pca/app:$SHORT_SHA
# $PROJECT_ID and $SHORT_SHA are provided automatically by Cloud Build.
#
# One-time setup (APIs, Artifact Registry repo "pca", Cloud SQL instance,
# secrets, IAM) is documented in deploy/README.md.

substitutions:
  _REGION: us-central1
  # Full Cloud SQL connection name: PROJECT:REGION:INSTANCE
  _INSTANCE_CONNECTION_NAME: PROJECT_ID:us-central1:pca-db
  _SERVICE: pca-app
  # Pinned Secret Manager versions (override per release if you rotate).
  _DATABASE_URL_SECRET: database-url:latest
  _AUTH_SECRET_SECRET: auth-secret:latest
  # Vertex AI (Claude) project for ADC-based LLM calls at runtime.
  _ANTHROPIC_VERTEX_PROJECT_ID: PROJECT_ID

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$SHORT_SHA"

steps:
  # -------------------------------------------------------------------------
  # 1) Build the image. (No build-args needed; prisma generate runs in-image.)
  # -------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$SHORT_SHA"
      - --tag
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:latest"
      - .

  # -------------------------------------------------------------------------
  # 2) Push the image to Artifact Registry.
  # -------------------------------------------------------------------------
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app"
    waitFor: ["build"]

  # -------------------------------------------------------------------------
  # 3) Run database migrations: `prisma migrate deploy`.
  #
  # Migrations must NOT run during `docker build` (no DB reachable then).
  # Here we run the just-built image with the Cloud SQL Auth Proxy started in
  # the background inside the same step, so the container can reach the DB over
  # a unix socket at /cloudsql/<INSTANCE_CONNECTION_NAME> — exactly the path
  # Cloud Run uses in production.
  #
  # DATABASE_URL is read from Secret Manager via availableSecrets below.
  # The Cloud Build service account needs roles/cloudsql.client and
  # roles/secretmanager.secretAccessor (see deploy/README.md).
  #
  # The standalone runner image ships a pruned node_modules, so the Prisma CLI
  # is NOT present in it. We run migrations with `npx --yes prisma@7 migrate
  # deploy`, which fetches the CLI on the fly and applies prisma/migrations.
  # -------------------------------------------------------------------------
  - id: migrate
    name: "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$SHORT_SHA"
    entrypoint: sh
    secretEnv: ["DATABASE_URL"]
    args:
      - -c
      - |
        set -e
        # Start the Cloud SQL Auth Proxy (unix socket mode) in the background.
        # The proxy binary is fetched fresh; pin a version for reproducibility.
        PROXY_VERSION=2.14.1
        wget -qO /cloud-sql-proxy \
          "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
        chmod +x /cloud-sql-proxy
        mkdir -p /cloudsql
        /cloud-sql-proxy --unix-socket /cloudsql "${_INSTANCE_CONNECTION_NAME}" &
        PROXY_PID=$!
        # Give the proxy a moment to create the socket.
        sleep 5
        npx --yes prisma@7 migrate deploy
        kill "$PROXY_PID" || true
    waitFor: ["push"]

  # -------------------------------------------------------------------------
  # 4) Deploy to Cloud Run.
  #
  # --add-cloudsql-instances mounts the unix socket at /cloudsql/<conn> in the
  #   running service (matches the production DATABASE_URL ?host=/cloudsql/...).
  # --set-secrets pins DATABASE_URL and AUTH_SECRET to Secret Manager versions.
  # --set-env-vars wires the Vertex AI (Claude via ADC) configuration.
  #   Do NOT set PORT — Cloud Run injects it.
  # The runtime service account needs roles/cloudsql.client,
  #   roles/secretmanager.secretAccessor, and roles/aiplatform.user.
  # -------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET},AUTH_SECRET=${_AUTH_SECRET_SECRET}
      - --set-env-vars=LLM_PROVIDER=vertex,ANTHROPIC_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},CLOUD_ML_REGION=global,AUTH_TRUST_HOST=true
    waitFor: ["migrate"]

# Secret Manager values exposed to build steps (step 3 only consumes it).
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: DATABASE_URL
