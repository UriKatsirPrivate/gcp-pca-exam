# Cloud Build pipeline: build -> push -> migrate -> deploy.
#
# Submit with (see deploy/README.md for the full substitution list):
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=REGION,_INSTANCE_CONNECTION_NAME=PROJECT:REGION:INSTANCE,\
# _SERVICE=pca-app,_RUN_SA_EMAIL=pca-run@PROJECT:.iam.gserviceaccount.com,\
# _DB_IAM_USER=pca-run@PROJECT.iam,_ANTHROPIC_VERTEX_PROJECT_ID=PROJECT
#
# Image path: REGION-docker.pkg.dev/$PROJECT_ID/pca/app:$BUILD_ID
# $PROJECT_ID and $BUILD_ID are provided automatically by Cloud Build.
#
# One-time setup (APIs, Artifact Registry repo "pca", Cloud SQL instance,
# secrets, IAM) is documented in deploy/README.md.

substitutions:
  _REGION: us-central1
  # Full Cloud SQL connection name: PROJECT:REGION:INSTANCE
  _INSTANCE_CONNECTION_NAME: PROJECT_ID:us-central1:pca-db
  _SERVICE: pca-app
  # Cloud SQL database name (passwordless IAM auth — no DB password anywhere).
  _DB_NAME: pca
  # Runtime service account the Cloud Run service runs as.
  _RUN_SA_EMAIL: pca-run@PROJECT_ID.iam.gserviceaccount.com
  # Its IAM DB username = that email WITHOUT the ".gserviceaccount.com" suffix.
  # Used both at runtime and (via impersonation) to run migrations.
  _DB_IAM_USER: pca-run@PROJECT_ID.iam
  # PUBLIC (default), PRIVATE, or PSC — must match the instance's IP config.
  _DB_IP_TYPE: PUBLIC
  # Public service URL. REQUIRED on Cloud Run: without it Auth.js resolves the
  # host to the container's 0.0.0.0:8080 and OAuth callbacks fail. Must match a
  # redirect URI registered on the Google OAuth client.
  _AUTH_URL: https://pca-app-hrqoscmbca-zf.a.run.app
  # Pinned Secret Manager version (override per release if you rotate).
  _AUTH_SECRET_SECRET: auth-secret:latest
  # Vertex AI (Claude) project for ADC-based LLM calls at runtime.
  _ANTHROPIC_VERTEX_PROJECT_ID: PROJECT_ID
  # Bootstrap admin emails (space-separated): granted the admin role. They must still
  # be on an allowed email domain (ALLOWED_EMAIL_DOMAINS, default google.com) to sign in.
  _ADMIN_EMAILS: "ukatsir@google.com"
  # GCS bucket (name only) holding module narration MP3s, served via the
  # auth-gated /api/audio proxy. Empty hides the player. Audio is generated
  # offline (npm run tts:generate); the runtime SA needs objectViewer on it.
  _AUDIO_BUCKET: ""
  # Cloud Run container resources.
  _CPU: "2"
  _MEMORY: 1Gi

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$BUILD_ID"

steps:
  # -------------------------------------------------------------------------
  # 1) Build the image. (No build-args needed; prisma generate runs in-image.)
  # -------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$BUILD_ID"
      - --tag
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:latest"
      - .

  # -------------------------------------------------------------------------
  # 2) Push the image to Artifact Registry.
  # -------------------------------------------------------------------------
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app"
    waitFor: ["build"]

  # -------------------------------------------------------------------------
  # 3) Run database migrations: `prisma migrate deploy` — passwordless (IAM).
  #
  # Migrations must NOT run during `docker build` (no DB reachable then). Here we
  # run the Cloud SQL Auth Proxy with --auto-iam-authn in the background, so the
  # Prisma CLI reaches the DB over a unix socket and authenticates as an IAM DB
  # user (no password). DATABASE_URL is constructed in-step from substitutions;
  # the IAM username's "@" is percent-encoded (%40) for the URL userinfo.
  #
  # The proxy authenticates as the runtime SA via --impersonate-service-account,
  # so migrations run as the SAME IAM DB user the app uses at runtime (one DB
  # user, least privilege). The Cloud Build SA therefore needs
  # roles/iam.serviceAccountTokenCreator on the runtime SA, plus
  # roles/cloudsql.client and roles/cloudsql.instanceUser (see deploy/README.md).
  #
  # The standalone runner image ships a pruned node_modules, so the Prisma CLI
  # is NOT present in it. We run migrations with `npx --yes prisma@7 migrate
  # deploy`, which fetches the CLI on the fly and applies prisma/migrations.
  # -------------------------------------------------------------------------
  - id: migrate
    name: "${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$BUILD_ID"
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        # Start the Cloud SQL Auth Proxy (IAM auth, unix socket) in background.
        # The proxy binary is fetched fresh; pin a version for reproducibility.
        # NOTE: shell variables use $$ so Cloud Build does not treat them as
        # build substitutions; ${_...} are real Cloud Build substitutions.
        # The runner image runs as a non-root user, so write to /tmp (writable).
        PROXY_VERSION=2.14.1
        wget -qO /tmp/cloud-sql-proxy \
          "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v$${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
        chmod +x /tmp/cloud-sql-proxy
        mkdir -p /tmp/cloudsql
        /tmp/cloud-sql-proxy --auto-iam-authn \
          --impersonate-service-account "${_RUN_SA_EMAIL}" \
          --unix-socket /tmp/cloudsql "${_INSTANCE_CONNECTION_NAME}" &
        PROXY_PID=$$!
        # Give the proxy a moment to create the socket.
        sleep 5
        ENC_USER=$$(printf '%s' "${_DB_IAM_USER}" | sed 's/@/%40/g')
        export DATABASE_URL="postgresql://$${ENC_USER}@localhost/${_DB_NAME}?host=/tmp/cloudsql/${_INSTANCE_CONNECTION_NAME}&sslmode=disable"
        # Non-root user: keep npm/npx caches in writable /tmp.
        export HOME=/tmp
        export npm_config_cache=/tmp/.npm
        # This step runs in /workspace (uploaded source, no node_modules), but
        # prisma.config.ts imports `dotenv/config` and `prisma/config`. Install
        # both in isolation and expose via NODE_PATH so the config + CLI resolve.
        npm install --no-save --no-audit --no-fund --prefix /tmp/deps prisma@7 dotenv >/dev/null 2>&1
        export NODE_PATH=/tmp/deps/node_modules
        /tmp/deps/node_modules/.bin/prisma migrate deploy
        kill "$${PROXY_PID}" || true
    waitFor: ["push"]

  # -------------------------------------------------------------------------
  # 4) Deploy to Cloud Run — passwordless Cloud SQL via the Node connector.
  #
  # The app uses @google-cloud/cloud-sql-connector at runtime, which connects to
  #   Cloud SQL over the Admin API using the service account's IAM identity. No
  #   DB password and NO --add-cloudsql-instances socket mount is needed.
  # --set-secrets pins only AUTH_SECRET to a Secret Manager version.
  # --set-env-vars wires the Cloud SQL connector (CLOUD_SQL_CONNECTION_NAME +
  #   DB_USER + DB_NAME, IAM auth on by default) and Vertex AI (Claude via ADC).
  #   Do NOT set PORT — Cloud Run injects it.
  # The runtime service account needs roles/cloudsql.client,
  #   roles/cloudsql.instanceUser, roles/secretmanager.secretAccessor, and
  #   roles/aiplatform.user (see deploy/README.md).
  # -------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/pca/app:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --service-account=${_RUN_SA_EMAIL}
      - --set-secrets=AUTH_SECRET=${_AUTH_SECRET_SECRET},AUTH_GOOGLE_ID=auth-google-id:latest,AUTH_GOOGLE_SECRET=auth-google-secret:latest
      - --set-env-vars=CLOUD_SQL_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},DB_USER=${_DB_IAM_USER},DB_NAME=${_DB_NAME},DB_IAM_AUTH=true,CLOUD_SQL_IP_TYPE=${_DB_IP_TYPE},LLM_PROVIDER=vertex,ANTHROPIC_VERTEX_PROJECT_ID=${_ANTHROPIC_VERTEX_PROJECT_ID},CLOUD_ML_REGION=global,AUTH_TRUST_HOST=true,AUTH_URL=${_AUTH_URL},ADMIN_EMAILS=${_ADMIN_EMAILS},AUDIO_BUCKET=${_AUDIO_BUCKET}
    waitFor: ["migrate"]
